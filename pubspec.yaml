name: flutter_ai_testing
description: App tools that let an AI agent test a Flutter app through Marionette, plus key checks and a launch script.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Must match the marionette_mcp version installed on the machine.
  marionette_flutter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
