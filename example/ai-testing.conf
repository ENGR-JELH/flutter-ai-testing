# flutter_ai_testing settings for this app. KEY=value lines; read, never executed.

# Launch (start_app, dart run flutter_ai_testing:run)
APP_ID=dev.example.ai_testing_example
TARGET=marionette/main.dart
# Optional compile-time setting the test build needs, with a safety check:
# the value must contain DEFINE_MUST_CONTAIN (for example a test host).
# DEFINE_NAME=API_BASE_URL
# DEFINE_DEFAULT=https://test.example.com
# DEFINE_MUST_CONTAIN=test
# OS permissions to grant before testing (Marionette can't tap OS dialogs).
ANDROID_PERMISSIONS=
IOS_PERMISSIONS=
URI_DIR=.marionette
# FLUTTER_VERSION=3.47.9

# Keys (dart run flutter_ai_testing:keys check|index)
KEYS_LIB=lib
KEYS_INDEX=docs/test-keys.md
KEYS_GUIDE=AUTOMATION-TESTING.md
SCREEN_KEY_SUFFIX=_screen
# Class holding key constants, and the file it is in:
# KEYS_CLASS=TestKeys
# KEYS_CONSTANTS=lib/shared/test_keys.dart
# How to show a key built by a method, one line each:
# KEYS_DYNAMIC=navTab=nav_tab_<tab>
# Method that switches tabs, so the index says "switches tab":
# KEYS_TAB_SWITCH=changeTab
# Extra lines for the index header, one per line:
# KEYS_NOTE=Icons inside a text field use the field's key plus `_suffix`.
